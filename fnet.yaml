name: cli

# @fnet/shell-flow commands
commands:
  build:
    description: Build all CLIs, link, and compile native binaries to ~/.fnet/bin/
    usage: frun build
    steps:
      - bun run build
      - bun ./dist/fnode/index.js --version
      - bun ./dist/fnet/index.js --version
      - bun ./dist/frun/index.js --version
      - bun ./dist/fbin/index.js --version
      - bun ./dist/fservice/index.js --version
      - bun link
      - echo: "Compiling native binaries..."
      - bun build ./dist/frun/index.js --compile --outfile=$HOME/.fnet/bin/frun
      - bun build ./dist/fbin/index.js --compile --outfile=$HOME/.fnet/bin/fbin
      - bun build ./dist/fservice/index.js --compile --outfile=$HOME/.fnet/bin/fservice
      - echo: "Native binaries installed to ~/.fnet/bin/"

  deploy:
    description: Build and publish package to npm
    usage: frun deploy
    steps:
      - fnet build
      - bun publish --access public

  compile-fservice:
    - bun build ./dist/fservice/index.js --compile --outfile=.bin/fservice
    - du -h .bin/fservice
    - chmod +x .bin/fservice
    - .bin/fservice --help
    - otool -L .bin/fservice

  compile-frun:
    - bun build ./dist/frun/index.js --compile --outfile=.bin/frun
    - du -h .bin/frun
    - chmod +x .bin/frun
    - .bin/frun --help
    - otool -L .bin/frun

  compile-fbin:
    - bun build ./dist/fbin/index.js --compile --outfile=.bin/fbin
    - du -h .bin/fbin
    - chmod +x .bin/fbin
    - .bin/fbin --help
    - otool -L .bin/fbin

  compile-fnode:
    - bun build ./dist/fnode/index.js --compile --outfile=.bin/fnode
    - du -h .bin/fnode
    - chmod +x .bin/fnode
    - .bin/fnode --help
    - otool -L .bin/fnode

  compile-fnet:
    - bun build ./dist/fnet/index.js --compile --outfile=.bin/fnet
    - du -h .bin/fnet
    - chmod +x .bin/fnet
    - .bin/fnet --help
    - otool -L .bin/fnet

  compile:
    steps:
      - frun compile-fservice
      - pause: true

      - frun build
      - pause: true

      - frun compile-fbin
      - pause: true

      - frun compile-frun
      - pause: true

      - frun compile-fnode
      - pause: true

      - frun compile-fnet
      - pause: true

  create-fnode-node:
    - rm -rf .tests/fnode-node
    - wdir: .tests
      steps:
        - fnode create --name fnode-node --runtime node
        - wdir: .tests/fnode-node
          steps:
            # - fnode build
            - fnode cli

  create-fnet-node:
    - rm -rf .tests/fnet-node
    - wdir: .tests
      steps:
        - fnet create --name fnet-node --runtime node
        - wdir: .tests/fnet-node
          steps:
            # - fnet build
            - fnet cli

  create-fnode-python:
    - rm -rf .tests/fnode-python
    - wdir: .tests
      steps:
        - fnode create --name fnode-python --runtime python
        - wdir: .tests/fnode-python
          steps:
            # - fnode build
            - fnode cli

  create-fnode-bun:
    - rm -rf .tests/fnode-bun
    - wdir: .tests
      steps:
        - fnode create --name fnode-bun --runtime bun
        - wdir: .tests/fnode-bun
          steps:
            # - fnode build
            - fnode cli

  create-all:
    - xfrun create-fnode-node
    - xfrun create-fnet-node
    - xfrun create-fnode-python
    - xfrun create-fnode-bun