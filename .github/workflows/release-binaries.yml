name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - bun-darwin-arm64
          - bun-darwin-x64
          - bun-linux-x64
          - bun-linux-arm64
          - bun-windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build.js

      - name: Set platform variables
        id: platform
        run: |
          TARGET="${{ matrix.target }}"
          OS=$(echo "$TARGET" | cut -d'-' -f2)
          ARCH=$(echo "$TARGET" | cut -d'-' -f3)
          EXT=""
          if [ "$OS" = "windows" ]; then EXT=".exe"; fi
          echo "os=$OS" >> $GITHUB_OUTPUT
          echo "arch=$ARCH" >> $GITHUB_OUTPUT
          echo "ext=$EXT" >> $GITHUB_OUTPUT
          echo "target=$TARGET" >> $GITHUB_OUTPUT

      - name: Compile binaries
        run: |
          mkdir -p release
          TARGET="${{ steps.platform.outputs.target }}"
          EXT="${{ steps.platform.outputs.ext }}"
          OS="${{ steps.platform.outputs.os }}"
          ARCH="${{ steps.platform.outputs.arch }}"

          for CLI in frun fbin fservice; do
            echo "Compiling $CLI for $TARGET..."
            bun build ./dist/$CLI/index.js \
              --compile \
              --target=$TARGET \
              --outfile=release/${CLI}${EXT}
          done

      - name: Package binaries (tar.gz)
        if: steps.platform.outputs.os != 'windows'
        run: |
          OS="${{ steps.platform.outputs.os }}"
          ARCH="${{ steps.platform.outputs.arch }}"
          cd release
          for CLI in frun fbin fservice; do
            chmod +x $CLI
            tar -czf "${CLI}-${OS}-${ARCH}.tar.gz" $CLI
            rm $CLI
          done

      - name: Package binaries (zip)
        if: steps.platform.outputs.os == 'windows'
        run: |
          OS="${{ steps.platform.outputs.os }}"
          ARCH="${{ steps.platform.outputs.arch }}"
          cd release
          for CLI in frun.exe fbin.exe fservice.exe; do
            NAME="${CLI%.exe}"
            zip "${NAME}-${OS}-${ARCH}.zip" $CLI
            rm $CLI
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ steps.platform.outputs.os }}-${{ steps.platform.outputs.arch }}
          path: release/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
