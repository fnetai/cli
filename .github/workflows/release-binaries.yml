name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write



jobs:
  build:
    strategy:
      matrix:
        include:
          - target: bun-darwin-arm64
            runner: macos-latest
          - target: bun-darwin-x64
            runner: ubuntu-latest
          - target: bun-linux-x64
            runner: ubuntu-latest
          - target: bun-linux-arm64
            runner: ubuntu-latest
          - target: bun-windows-x64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build.js

      - name: Set platform variables
        id: platform
        run: |
          TARGET="${{ matrix.target }}"
          OS=$(echo "$TARGET" | cut -d'-' -f2)
          ARCH=$(echo "$TARGET" | cut -d'-' -f3)
          EXT=""
          if [ "$OS" = "windows" ]; then EXT=".exe"; fi
          echo "os=$OS" >> $GITHUB_OUTPUT
          echo "arch=$ARCH" >> $GITHUB_OUTPUT
          echo "ext=$EXT" >> $GITHUB_OUTPUT
          echo "target=$TARGET" >> $GITHUB_OUTPUT

      - name: Compile binaries
        run: |
          mkdir -p release
          TARGET="${{ steps.platform.outputs.target }}"
          EXT="${{ steps.platform.outputs.ext }}"
          OS="${{ steps.platform.outputs.os }}"
          ARCH="${{ steps.platform.outputs.arch }}"
          RUNNER_OS="${{ runner.os }}"

          for CLI in frun fbin fservice fnode fnet; do
            echo "Compiling $CLI for $TARGET..."
            if [ "$RUNNER_OS" = "macOS" ]; then
              # Build natively on macOS to get proper code signing
              bun build ./dist/$CLI/index.js \
                --compile \
                --outfile=release/${CLI}${EXT}
            else
              bun build ./dist/$CLI/index.js \
                --compile \
                --target=$TARGET \
                --outfile=release/${CLI}${EXT}
            fi
          done

      - name: Verify macOS binary signatures
        if: runner.os == 'macOS'
        run: |
          for CLI in frun fbin fservice fnode fnet; do
            echo "Verifying release/$CLI..."
            codesign -dvv release/$CLI 2>&1
          done

      - name: Package binaries (tar.gz)
        if: steps.platform.outputs.os != 'windows'
        run: |
          OS="${{ steps.platform.outputs.os }}"
          ARCH="${{ steps.platform.outputs.arch }}"
          cd release
          for CLI in frun fbin fservice fnode fnet; do
            chmod +x $CLI
            tar -czf "${CLI}-${OS}-${ARCH}.tar.gz" $CLI
            rm $CLI
          done

      - name: Package binaries (zip)
        if: steps.platform.outputs.os == 'windows'
        run: |
          OS="${{ steps.platform.outputs.os }}"
          ARCH="${{ steps.platform.outputs.arch }}"
          cd release
          for CLI in frun.exe fbin.exe fservice.exe fnode.exe fnet.exe; do
            NAME="${CLI%.exe}"
            zip "${NAME}-${OS}-${ARCH}.zip" $CLI
            rm $CLI
          done

      - name: Package templates (once per platform)
        if: steps.platform.outputs.os != 'windows' && steps.platform.outputs.arch == 'arm64'
        run: |
          cd template && tar -czf ../release/fnet-templates.tar.gz . && cd ..
        # Templates are platform-independent, only package once (arm64 job)

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: binaries-${{ steps.platform.outputs.os }}-${{ steps.platform.outputs.arch }}
          path: release/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  npm-publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies (skip postinstall to keep bin/ as shims)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build project
        run: bun run build.js

      - name: Verify bin/ contains shims (not compiled binaries)
        run: |
          for CLI in frun fbin fservice fnode fnet; do
            if ! head -1 "bin/$CLI" | grep -q '^#!/usr/bin/env node'; then
              echo "ERROR: bin/$CLI is not a JS shim"
              exit 1
            fi
          done
          echo "All bin/ files are JS shims"

      - name: Setup Node.js (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  install-verify-npm:
    needs: npm-publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Get version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for npm propagation
        shell: bash
        run: sleep 30

      - name: Install
        run: npm install -g @fnet/cli@${{ steps.version.outputs.version }}

      - name: Verify install
        shell: bash
        run: |
          EXPECTED="${{ steps.version.outputs.version }}"
          for CLI in frun fbin fservice fnode fnet; do
            ACTUAL=$($CLI --version 2>&1 | tr -d '[:space:]')
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "✗ $CLI: expected $EXPECTED, got $ACTUAL"
              exit 1
            fi
            echo "✓ $CLI $ACTUAL"
          done

      - name: Uninstall
        run: npm uninstall -g @fnet/cli

      - name: Verify uninstall
        shell: bash
        run: |
          for CLI in frun fbin fservice fnode fnet; do
            if command -v $CLI >/dev/null 2>&1; then
              echo "✗ $CLI still exists after uninstall"
              exit 1
            fi
            echo "✓ $CLI removed"
          done

  install-verify-bun:
    needs: npm-publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Get version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Wait for npm propagation
        shell: bash
        run: sleep 30

      - name: Install
        shell: bash
        run: bun install -g @fnet/cli@${{ steps.version.outputs.version }}

      - name: Add bun bin to PATH
        shell: bash
        run: echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Verify install
        shell: bash
        run: |
          EXPECTED="${{ steps.version.outputs.version }}"
          for CLI in frun fbin fservice fnode fnet; do
            ACTUAL=$($CLI --version 2>&1 | tr -d '[:space:]')
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "✗ $CLI: expected $EXPECTED, got $ACTUAL"
              exit 1
            fi
            echo "✓ $CLI $ACTUAL"
          done

      - name: Uninstall
        shell: bash
        run: bun remove -g @fnet/cli

      - name: Verify uninstall
        shell: bash
        run: |
          for CLI in frun fbin fservice fnode fnet; do
            if [ -x "$HOME/.bun/bin/$CLI" ]; then
              echo "✗ $CLI still exists after uninstall"
              exit 1
            fi
            echo "✓ $CLI removed"
          done

  install-verify-brew:
    needs: update-homebrew
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Install via Homebrew
        run: |
          brew tap fnetai/tap
          brew install fnet

      - name: Verify install
        run: |
          EXPECTED="${{ steps.version.outputs.version }}"
          for CLI in frun fbin fservice fnode fnet; do
            ACTUAL=$($CLI --version 2>&1 | tr -d '[:space:]')
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "✗ $CLI: expected $EXPECTED, got $ACTUAL"
              exit 1
            fi
            echo "✓ $CLI $ACTUAL"
          done

      - name: Reinstall (test idempotency)
        run: brew reinstall fnet

      - name: Verify reinstall
        run: |
          EXPECTED="${{ steps.version.outputs.version }}"
          for CLI in frun fbin fservice fnode fnet; do
            ACTUAL=$($CLI --version 2>&1 | tr -d '[:space:]')
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "✗ $CLI: expected $EXPECTED, got $ACTUAL"
              exit 1
            fi
            echo "✓ $CLI $ACTUAL"
          done

      - name: Uninstall
        run: brew uninstall fnet

      - name: Verify uninstall
        run: |
          for CLI in frun fbin fservice fnode fnet; do
            if command -v $CLI >/dev/null 2>&1; then
              echo "✗ $CLI still exists after uninstall"
              exit 1
            fi
            echo "✓ $CLI removed"
          done

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download checksums
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release download "v${VERSION}" \
            --repo fnetai/cli \
            --pattern "checksums.txt" \
            --dir .
          cat checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Parse checksums
        id: sha
        run: |
          get_sha() { grep "$1" checksums.txt | awk '{print $1}'; }
          for CLI in frun fbin fservice fnode fnet; do
            for PLATFORM in darwin_arm64 darwin_x64 linux_arm64 linux_x64; do
              KEY="${CLI}_${PLATFORM}"
              FILE="${CLI}-$(echo $PLATFORM | tr '_' '-')"
              echo "${KEY}=$(get_sha $FILE)" >> $GITHUB_OUTPUT
            done
          done
          echo "templates=$(get_sha fnet-templates)" >> $GITHUB_OUTPUT

      - name: Checkout homebrew-tap
        uses: actions/checkout@v5
        with:
          repository: fnetai/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Generate formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DL="https://github.com/fnetai/cli/releases/download/v${VERSION}"

          cat > Formula/fnet.rb << EOF
          class Fnet < Formula
            desc "Flownet CLI - development framework that separates Core from Layers"
            homepage "https://github.com/fnetai/cli"
            version "${VERSION}"
            license "MIT"

            resource "templates" do
              url "${DL}/fnet-templates.tar.gz"
              sha256 "${{ steps.sha.outputs.templates }}"
            end

            on_macos do
              if Hardware::CPU.arm?
                url "${DL}/frun-darwin-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.frun_darwin_arm64 }}"

                resource "fbin" do
                  url "${DL}/fbin-darwin-arm64.tar.gz"
                  sha256 "${{ steps.sha.outputs.fbin_darwin_arm64 }}"
                end

                resource "fservice" do
                  url "${DL}/fservice-darwin-arm64.tar.gz"
                  sha256 "${{ steps.sha.outputs.fservice_darwin_arm64 }}"
                end

                resource "fnode" do
                  url "${DL}/fnode-darwin-arm64.tar.gz"
                  sha256 "${{ steps.sha.outputs.fnode_darwin_arm64 }}"
                end

                resource "fnet-cli" do
                  url "${DL}/fnet-darwin-arm64.tar.gz"
                  sha256 "${{ steps.sha.outputs.fnet_darwin_arm64 }}"
                end
              else
                url "${DL}/frun-darwin-x64.tar.gz"
                sha256 "${{ steps.sha.outputs.frun_darwin_x64 }}"

                resource "fbin" do
                  url "${DL}/fbin-darwin-x64.tar.gz"
                  sha256 "${{ steps.sha.outputs.fbin_darwin_x64 }}"
                end

                resource "fservice" do
                  url "${DL}/fservice-darwin-x64.tar.gz"
                  sha256 "${{ steps.sha.outputs.fservice_darwin_x64 }}"
                end

                resource "fnode" do
                  url "${DL}/fnode-darwin-x64.tar.gz"
                  sha256 "${{ steps.sha.outputs.fnode_darwin_x64 }}"
                end

                resource "fnet-cli" do
                  url "${DL}/fnet-darwin-x64.tar.gz"
                  sha256 "${{ steps.sha.outputs.fnet_darwin_x64 }}"
                end
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${DL}/frun-linux-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.frun_linux_arm64 }}"

                resource "fbin" do
                  url "${DL}/fbin-linux-arm64.tar.gz"
                  sha256 "${{ steps.sha.outputs.fbin_linux_arm64 }}"
                end

                resource "fservice" do
                  url "${DL}/fservice-linux-arm64.tar.gz"
                  sha256 "${{ steps.sha.outputs.fservice_linux_arm64 }}"
                end

                resource "fnode" do
                  url "${DL}/fnode-linux-arm64.tar.gz"
                  sha256 "${{ steps.sha.outputs.fnode_linux_arm64 }}"
                end

                resource "fnet-cli" do
                  url "${DL}/fnet-linux-arm64.tar.gz"
                  sha256 "${{ steps.sha.outputs.fnet_linux_arm64 }}"
                end
              else
                url "${DL}/frun-linux-x64.tar.gz"
                sha256 "${{ steps.sha.outputs.frun_linux_x64 }}"

                resource "fbin" do
                  url "${DL}/fbin-linux-x64.tar.gz"
                  sha256 "${{ steps.sha.outputs.fbin_linux_x64 }}"
                end

                resource "fservice" do
                  url "${DL}/fservice-linux-x64.tar.gz"
                  sha256 "${{ steps.sha.outputs.fservice_linux_x64 }}"
                end

                resource "fnode" do
                  url "${DL}/fnode-linux-x64.tar.gz"
                  sha256 "${{ steps.sha.outputs.fnode_linux_x64 }}"
                end

                resource "fnet-cli" do
                  url "${DL}/fnet-linux-x64.tar.gz"
                  sha256 "${{ steps.sha.outputs.fnet_linux_x64 }}"
                end
              end
            end

            def install
              bin.install "frun"

              %w[fbin fservice fnode].each do |cli|
                resource(cli).stage { bin.install cli }
              end

              resource("fnet-cli").stage { bin.install "fnet" }

              resource("templates").stage do
                (share/"fnet/template").install Dir["*"]
              end
            end


            test do
              %w[frun fbin fservice fnode fnet].each do |cli|
                assert_match version.to_s, shell_output("#{bin}/#{cli} --version")
              end
            end
          end
          EOF

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' Formula/fnet.rb

          echo "=== Generated Formula ==="
          cat Formula/fnet.rb

      - name: Commit and push
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/fnet.rb
          git commit -m "update fnet to v${VERSION}"
          git push
