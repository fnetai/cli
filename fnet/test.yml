# fnode-bun
test::fnode::bun::create:
  description: Test fnode project creation with bun runtime
  usage: frun test::fnode::bun::create
  steps:
    - mkdir -p .tests && rm -rf .tests/fnode-bun
    - wdir: .tests
      steps:
        - fnode create --name fnode-bun --runtime bun --no-vscode --no-git --no-build

test::fnode::bun::build:
  description: Test fnode project build and run with bun runtime
  usage: frun test::fnode::bun::build
  steps:
    - wdir: .tests/fnode-bun
      steps:
        - fnode build

test::fnode::bun::cli:
  description: Test fnode project CLI with bun runtime
  usage: frun test::fnode::bun::cli
  steps:
    - wdir: .tests/fnode-bun
      steps:
        - fnode cli

test::fnode::bun::cleanup:
  description: Test fnode project cleanup with bun runtime
  usage: frun test::fnode::bun::cleanup
  steps:
    - rm -rf .tests/fnode-bun

test::fnode::bun:
  description: Test full fnode project lifecycle with bun runtime
  usage: frun test::fnode::bun
  steps:
    - frun test::fnode::bun::create
    - frun test::fnode::bun::build
    - frun test::fnode::bun::cli
    - frun test::fnode::bun::cleanup

