# --- Test commands ---
test::create:
  description: Test fnode/fnet project creation (node, python, bun)
  usage: frun test::create
  steps:
    - rm -rf .tests
    - mkdir -p .tests
    # fnode projects
    - wdir: .tests
      steps:
        # fnode projects
        - fnode create --name test-node --runtime node --no-vscode --no-git --no-build
        - fnode create --name test-python --runtime python --no-vscode --no-git --no-build
        - fnode create --name test-bun --runtime bun --no-vscode --no-git --no-build
        # fnet projects
        - fnet create --name test-flow-node --runtime node --no-vscode --no-git --no-build
        - fnet create --name test-flow-bun --runtime bun --no-vscode --no-git --no-build
    - echo: "All projects created successfully"

test::build:
  description: Test fnode/fnet project build and run
  usage: frun test::build
  steps:
    - wdir: .tests/test-node
      steps:
        - fnode build
        - fnode cli
    - wdir: .tests/test-python
      steps:
        - fnode build
        - fnode cli
    - wdir: .tests/test-bun
      steps:
        - fnode build
        - fnode cli
    - wdir: .tests/test-flow-node
      steps:
        - fnet build
        - fnet cli
    - wdir: .tests/test-flow-bun
      steps:
        - fnet build
        - fnet cli
    - echo: "All projects built and ran successfully"

test::clean:
  description: Clean up test artifacts
  usage: frun test::clean
  steps:
    - rm -rf .tests
    - echo: "Test artifacts cleaned"

test:
  description: Run full test suite (create, build, clean)
  usage: frun test
  steps:
    - frun test::create
    - frun test::build
    - frun test::clean
    - echo: "All tests passed!"
