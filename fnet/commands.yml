build:
  description: Build all CLIs, link, and compile native binaries to ~/.fnet/bin/
  usage: frun build
  steps:
    - bun run build
    - bun ./dist/fnode/index.js --version
    - bun ./dist/fnet/index.js --version
    - bun ./dist/frun/index.js --version
    - bun ./dist/fbin/index.js --version
    - bun ./dist/fservice/index.js --version
    - bun link
    - echo: "Compiling native binaries..."
    - bun build ./dist/frun/index.js --compile --outfile=$HOME/.fnet/bin/frun
    - bun build ./dist/fbin/index.js --compile --outfile=$HOME/.fnet/bin/fbin
    - bun build ./dist/fservice/index.js --compile --outfile=$HOME/.fnet/bin/fservice
    - bun build ./dist/fnode/index.js --compile --outfile=$HOME/.fnet/bin/fnode
    - bun build ./dist/fnet/index.js --compile --outfile=$HOME/.fnet/bin/fnet
    - echo: "Copying templates to ~/.fnet/template/..."
    - rm -rf $HOME/.fnet/template
    - mkdir -p $HOME/.fnet/template
    - cp -r ./template/fnode $HOME/.fnet/template/fnode
    - cp -r ./template/fnet $HOME/.fnet/template/fnet
    - cp -r ./template/schemas $HOME/.fnet/template/schemas
    - echo: "Native binaries and templates installed to ~/.fnet/"

deploy:
  description: Build and publish package to npm
  usage: frun deploy
  steps:
    - fnet build
    - bun publish --access public

# --- Test commands ---

test-create:
  description: Test fnode/fnet project creation (node, python, bun)
  usage: frun test-create
  steps:
    - rm -rf .tests
    - mkdir -p .tests
    # fnode projects
    - wdir: .tests
      steps:
        - fnode create --name test-node --runtime node --no-vscode
        - fnode create --name test-python --runtime python --no-vscode
        - fnode create --name test-bun --runtime bun --no-vscode
        - fnet create --name test-flow --no-vscode
    - echo: "All projects created successfully"

test-build:
  description: Test fnode/fnet project build and run
  usage: frun test-build
  steps:
    - wdir: .tests/test-node
      steps:
        - fnode build
        - fnode cli
    - wdir: .tests/test-python
      steps:
        - fnode build
        - fnode cli
    - wdir: .tests/test-bun
      steps:
        - fnode build
        - fnode cli
    - wdir: .tests/test-flow
      steps:
        - fnet build
        - fnet cli
    - echo: "All projects built and ran successfully"

test-clean:
  description: Clean up test artifacts
  usage: frun test-clean
  steps:
    - rm -rf .tests
    - echo: "Test artifacts cleaned"

test:
  description: Run full test suite (create, build, clean)
  usage: frun test
  steps:
    - frun test-create
    - frun test-build
    - frun test-clean
    - echo: "All tests passed!"