build:
  description: Build all CLIs and link for local development
  usage: frun build
  steps:
    - bun run build
    - bun ./dist/fnode/index.js --version
    - bun ./dist/fnet/index.js --version
    - bun ./dist/frun/index.js --version
    - bun ./dist/fbin/index.js --version
    - bun ./dist/fservice/index.js --version
    - bun link
    - echo: "Restoring bin/ shims (in case bun update overwrote them with compiled binaries)..."
    - git checkout bin/
    - echo: "Build complete. Use 'bun link @fnet/cli' in projects to test."

merge::/:
  - g::file://./test.yml